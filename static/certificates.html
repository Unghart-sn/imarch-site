<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Certificates — IMARCH LTD</title>
<link rel="icon" href="/favicon.ico" sizes="any">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="/auth-config.js"></script>
<script src="/auth.js"></script>
<meta name="theme-color" content="#111827">
<style>
  :root {
    --c-bg:#f3f4f6; --c-card:#ffffff; --c-text:#111827; --c-muted:#6b7280;
    --c-border:#e5e7eb; --c-black:#111827; --c-ok:#059669; --c-err:#dc2626;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--c-bg); color: var(--c-text);
    margin: 0; padding: 2rem 1rem 0; line-height: 1.5;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  .wrap { max-width: 860px; margin: 0 auto; flex: 1; width: 100%; }

  .page-header {
    display: flex; justify-content: space-between; align-items: flex-end;
    gap: 16px; flex-wrap: wrap; margin-bottom: 1.5rem;
  }
  .page-header h2 { margin: 0; font-size: 1.75rem; font-weight: 700; color: var(--c-text); letter-spacing: -0.02em; }
  .page-header .sub { color: var(--c-muted); font-size: 0.9rem; margin-top: 4px; }

  .btn {
    display: inline-block; padding: 10px 20px; background: var(--c-black);
    color: #fff; text-decoration: none; border-radius: 8px;
    font-weight: 600; transition: background 0.15s; border: none;
    cursor: pointer; font-size: 0.9rem; font-family: inherit;
  }
  .btn:hover { background: #374151; }
  .btn-sm { padding: 6px 14px; font-size: 0.8rem; }
  .btn-ghost { background: transparent; color: var(--c-muted); border: 1px solid var(--c-border); }
  .btn-ghost:hover { background: var(--c-border); color: var(--c-text); }
  .btn.btn-sm.btn-download { background: #e5e7eb !important; color: #111 !important; }
  .btn.btn-sm.btn-download:hover { background: #d1d5db !important; }

  .card {
    background: var(--c-card); border: 1px solid var(--c-border);
    border-radius: 16px; padding: 1.5rem; margin-bottom: 1rem;
    box-shadow: 0 4px 20px rgba(0,0,0,0.03);
  }

  .tx-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  .tx-table th {
    text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--c-border);
    color: var(--c-muted); font-size: 0.75rem; text-transform: uppercase;
    letter-spacing: 0.05em; font-weight: 600;
  }
  .tx-table td {
    padding: 12px 8px; border-bottom: 1px solid var(--c-border);
    word-break: break-word; vertical-align: middle;
  }
  .tx-table tr:last-child td { border-bottom: none; }
  .mono { font-family: Consolas, Monaco, monospace; color: var(--c-muted); font-size: 0.8rem; }

  .loading { text-align: center; color: var(--c-muted); padding: 2rem; }
  .error-box {
    background: #fef2f2; border: 1px solid var(--c-err); color: var(--c-err);
    padding: 1rem; border-radius: 8px; text-align: center;
  }
  .empty { text-align: center; color: var(--c-muted); padding: 2rem; }

  @media (max-width: 600px) {
    .page-header { align-items: flex-start; }
    .tx-table th:nth-child(3), .tx-table td:nth-child(3) { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="page-header">
    <div>
      <h2>My Certificates</h2>
      <div class="sub">All your issued documents and proofs of priority</div>
    </div>
    <div style="display:flex; gap:8px; flex-wrap:wrap;">
      <a href="/app/#/dashboard" class="btn btn-ghost btn-sm">&larr; Back to Account</a>
      <a href="/en/certify/" class="btn">Order New Certificate</a>
    </div>
  </div>

  <div class="card" id="content">
    <div class="loading">Loading your certificates...</div>
  </div>
</div>

<script>
(function () {
  const contentEl = document.getElementById('content');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  }

  async function loadCertificates() {
    try {
      const session = await window.imarchAuth.getSession();
      if (!session || !session.user) {
        contentEl.innerHTML = '<div class="error-box">Please <a href="/login/" style="color:inherit;text-decoration:underline;">sign in</a> to view your certificates.</div>';
        return;
      }

      const sb = window.imarchAuth.getClient();
      const res = await sb.from('orders')
        .select('id,title,holder_name,created_at,pdf_url,status')
        .eq('issuer_user_id', session.user.id)
        .eq('status', 'ready')
        .order('created_at', { ascending: false });

      if (res.error) {
        contentEl.innerHTML = '<div class="error-box">Failed to load: ' + esc(res.error.message) + '</div>';
        return;
      }

      const orders = res.data || [];

      if (orders.length === 0) {
        contentEl.innerHTML = '<div class="empty">You have no certificates yet.</div>';
        return;
      }

      let h = '<table class="tx-table"><thead><tr>'
        + '<th>Date</th><th>Title</th><th>Holder</th><th style="text-align:right;">Action</th>'
        + '</tr></thead><tbody>';

      for (const o of orders) {
        const date = String(o.created_at || '').slice(0, 10);
        const url = o.pdf_url || '#';
        h += '<tr>'
          + '<td class="mono">' + esc(date) + '</td>'
          + '<td>' + esc(o.title || 'Untitled') + '</td>'
          + '<td>' + esc(o.holder_name || '—') + '</td>'
          + '<td style="text-align:right;">'
          + '<a href="' + esc(url) + '" target="_blank" class="btn btn-sm" style="background:#e5e7eb !important;color:#111 !important;border:1px solid #d1d5db !important;">Download PDF</a>'
          + '</td></tr>';
      }
      h += '</tbody></table>';

      contentEl.innerHTML = h;

    } catch (e) {
      contentEl.innerHTML = '<div class="error-box">Error: ' + esc(e.message) + '</div>';
    }
  }

  loadCertificates();
})();
</script>
</body>
</html>
