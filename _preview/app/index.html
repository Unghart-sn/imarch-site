<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IMARCH  Личный кабинет</title>
  <link rel="stylesheet" href="/app/app.css?v=3">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
  <script src="/auth-config.js"></script>
  <script src="/auth.js?v=3"></script>
  <script src="/app/topup-modal.js?v=1"></script>
  <script src="/app/dashboard.js?v=4" defer></script>
  <script src="/app/settings.js?v=4" defer></script>
  <script src="/app/treasury-flow.js?v=1" defer></script>
  <script src="/safe.js?v=2"></script>
  <script src="/safe-api.js?v=2"></script>
  <script src="/app/safe-view.js?v=2" defer></script>
<script src="/app/assets.js?v=1" defer></script>
  <script src="/app/app.js?v=5" defer></script>
</head>
<body>
  
<div class="app-shell">
  <aside class="app-sidebar" id="appSidebar">
    <div class="app-mobile-header">
      <div class="app-logo">
        <a href="/" style="display:flex; align-items:center; gap:8px;"><img src="/logo.png" alt="IMARCH" style="height:28px; width:auto; border-radius:50%;"> IMARCH</a>
      </div>
      <div class="app-mobile-balance" id="app-balance-mobile"></div>
      <button class="app-burger" id="appBurgerBtn" aria-label="Menu">
        <span></span><span></span><span></span>
      </button>
    </div>

    <div class="app-sidebar-content" id="appSidebarContent">
      <div class="app-sidebar-footer">
        <div class="app-balance-label">Balance</div>
        <div class="app-balance-value" id="app-balance"></div>
      </div>
      <nav class="app-nav">
        <a href="#/dashboard" class="app-nav-link" data-route="dashboard">My Certificates</a>
        <a href="#/safe" class="app-nav-link" data-route="safe">Digital Safe</a>
        <a href="#/assets" class="app-nav-link" data-route="assets">Asset Registry</a>
        <a href="#/settings" class="app-nav-link" data-route="settings">Settings</a>
      </nav>
    </div>
  </aside>

  <main class="app-workspace">
    <header class="app-topbar">
      <div class="app-topbar-title" id="app-page-title">Loading...</div>
      <div class="app-topbar-user" id="app-user"></div>
    </header>

    <section class="app-content" id="app-content">
      <div class="app-loading">Loading section...</div>
    </section>
  </main>
</div>

</body>
</html>
