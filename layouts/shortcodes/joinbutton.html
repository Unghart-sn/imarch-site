<div style="text-align: center; margin: 2rem 0;">
  <a href="{{ .Get "target" }}" 
     style="display: inline-block; padding: 0.75rem 1.5rem; font-size: 1.1rem; font-weight: bold; color: #fff; background: linear-gradient(90deg, #2e3a4b, #4b5a6e); border-radius: 6px; text-decoration: none; box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: transform 0.3s ease, background 0.3s ease;">
    {{ .Get "text" }}
  </a>
</div>
