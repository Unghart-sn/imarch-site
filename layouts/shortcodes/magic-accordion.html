.magic-accordion-final summary {

}

.magic-accordion-final[open] summary::after {

}

<script>
// Магия для плавного аккордеона
document.addEventListener('DOMContentLoaded', function() {
    const accordion = document.querySelector('.magic-accordion-final');
    const content = accordion.querySelector('.magic-accordion-content-final');
    
    accordion.addEventListener('toggle', function() {
        if (this.open) {
            // Открываем
            const contentHeight = content.scrollHeight + 'px';
            content.style.maxHeight = contentHeight;
            
            // Эффект "вбирания" контента
            this.style.transform = 'translateY(-5px)';
            setTimeout(() => {
                this.style.transform = 'translateY(0)';
            }, 300);
        } else {
            // Закрываем
            content.style.maxHeight = '0';
        }
    });
    
    // Инициализируем если аккордеон открыт по умолчанию
    if (accordion.open) {
        const contentHeight = content.scrollHeight + 'px';
        content.style.maxHeight = contentHeight;
    }
});
</script>
