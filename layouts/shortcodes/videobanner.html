<div class="pixel-perfect-square" onclick="universalTogglePlay(this)" style="
    position: relative; 
    width: 100%; 
    aspect-ratio: 1 / 1; 
    overflow: hidden; 
    border-radius: 8px; 
    cursor: pointer;
    background: #000;">
    
  <video 
    autoplay 
    muted 
    loop 
    playsinline
    poster="{{ .Get "poster" }}"
    style="
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: translate(-50%, -50%);">
    <source src="{{ .Get "src" }}" type="video/mp4">
  </video>

  <div class="sound-status-overlay" style="
      position: absolute;
      top: 15px;
      right: 15px;
      padding: 5px 10px;
      background: rgba(139, 115, 85, 0.8);
      color: white;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      border-radius: 4px;
      opacity: 0;
      transition: opacity 0.3s ease;">
      Audio Active
  </div>
</div>

{{ if not (.Page.Scratch.Get "toggleScriptLoaded") }}
{{ .Page.Scratch.Set "toggleScriptLoaded" true }}
<script>
function universalTogglePlay(container) {
  var v = container.querySelector('video');
  var status = container.querySelector('.sound-status-overlay');
  
  if (v.muted) {
    v.muted = false;
    status.style.opacity = '1';
    v.play(); 
  } else {
    v.muted = true;
    status.style.opacity = '0';
  }
}
</script>
{{ end }}
