<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCS — Cover</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0c12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            padding: 1rem;
        }

        /* Баннер / обложка — точная копия стиля оригинала */
        .cover {
            max-width: 1100px;
            width: 100%;
            background: #0f172a; /* глубокий тёмно-синий, как в PDF */
            border-radius: 40px;
            padding: 3rem 2.5rem;
            box-shadow: 0 30px 50px -15px rgba(0,0,0,0.8);
            border: 1px solid #2a3346;
            color: white;
            position: relative;
            transition: all 0.2s;
        }

        /* Верхняя плашка с меткой и конфиденциальностью */
        .cover-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            color: #8b9bb5;
            border-bottom: 1px solid #263040;
            padding-bottom: 1.2rem;
            margin-bottom: 2rem;
        }

        .confidential-tag {
            background: #1f2a3c;
            color: #facc15; /* жёлтый акцент, как в оригинале */
            padding: 0.25rem 1rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.75rem;
            border: 1px solid #3a4862;
        }

        /* Основной контент */
        .cover-main {
            margin-bottom: 3rem;
        }

        .cover-main h1 {
            font-size: 6rem;
            font-weight: 800;
            line-height: 1;
            letter-spacing: -0.03em;
            background: linear-gradient(145deg, #ffffff 0%, #b9c9ff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .cover-main .sub {
            font-size: 1.8rem;
            font-weight: 350;
            color: #b0c0da;
            margin-bottom: 2rem;
        }

        .cover-main .tagline {
            font-size: 1.1rem;
            color: #8b9bb5;
            max-width: 70%;
            border-left: 4px solid #3b7cff;
            padding-left: 1.2rem;
            margin-top: 2rem;
        }

        /* Нижняя часть */
        .cover-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #263040;
            padding-top: 1.5rem;
            color: #8b9bb5;
            font-size: 0.95rem;
            font-weight: 400;
        }

        .footer-left {
            display: flex;
            gap: 2rem;
        }

        .footer-right {
            color: #facc15;
            font-weight: 500;
        }

        /* Элемент "декоративный" — маленький квадрат (как в оригинальных питч-деках) */
        .corner-accent {
            position: absolute;
            top: 2rem;
            right: 2.5rem;
            width: 8px;
            height: 8px;
            background: #3b7cff;
            border-radius: 0;
        }

        @media (max-width: 700px) {
            .cover-main h1 { font-size: 3.5rem; }
            .cover-main .sub { font-size: 1.3rem; }
            .cover-main .tagline { max-width: 100%; }
            .footer-left { flex-direction: column; gap: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="cover">
        <!-- маленький угловой акцент (синий квадрат) -->
        <div class="corner-accent"></div>

        <!-- хедер как в оригинале -->
        <div class="cover-header">
            <span>PITCH DECK 2025</span>
            <span class="confidential-tag">CONFIDENTIAL</span>
        </div>

        <!-- основное содержание обложки -->
        <div class="cover-main">
            <h1>CCS</h1>
            <div class="sub">Corporate Communication Suite</div>
            <div class="tagline">
                Standardized digital infrastructure<br>for the next generation of business
            </div>
        </div>

        <!-- подвал: имя, должность, год — ровно как в PDF -->
        <div class="cover-footer">
            <div class="footer-left">
                <span>Alexander</span>
                <span>CEO & Founder</span>
            </div>
            <div class="footer-right">
                2025
            </div>
        </div>

        <!-- дополнительная надпись "confidential" мелко (не обязательно, но для атмосферы) -->
        <div style="text-align: right; margin-top: 1.5rem; font-size: 0.7rem; color: #3b4a63; letter-spacing: 0.1em;">
            ⚡ internal draft
        </div>
    </div>
</body>
</html>
