<script>
function toggleBlogAccordion(header) {
    const section = header.parentElement;
    const content = section.querySelector('.blog-accordion-content');
    const isOpen = content.classList.contains('open');
    
    document.querySelectorAll('.blog-accordion-content.open').forEach(openContent => {
        if (openContent !== content) {
            openContent.classList.remove('open');
            openContent.parentElement.querySelector('.blog-accordion-header').classList.remove('active');
        }
    });
    
    header.classList.toggle('active');
    content.classList.toggle('open');
    
    if (isOpen) {
        setTimeout(() => {
            content.style.maxHeight = '0';
        }, 10);
    } else {
        content.style.maxHeight = content.scrollHeight + 'px';
        setTimeout(() => {
            content.style.maxHeight = 'none';
        }, 400);
    }
}

// Простейший шаринг
document.querySelectorAll('.share-btn').forEach(btn => {
    btn.addEventListener('click', function() {
        const type = this.getAttribute('data-type');
        const url = window.location.href;
        const title = document.title;
        
        if (type === 'copy') {
            navigator.clipboard.writeText(url);
            alert('Ссылка скопирована!');
        } else if (type === 'twitter') {
            window.open(`https://twitter.com/intent/tweet?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}`, '_blank');
        } else if (type === 'telegram') {
            window.open(`https://t.me/share/url?url=${encodeURIComponent(url)}&text=${encodeURIComponent(title)}`, '_blank');
        } else if (type === 'medium') {
            window.open(`https://medium.com/m/import?url=${encodeURIComponent(url)}`, '_blank');
        }
    });
});
</script>
