{{ define "main" }}

  <aside class="app-sidebar">
    <div class="app-logo">
      <a href="/">IMARCH</a>
    </div>
    <nav class="app-nav">
      <a href="#/dashboard" class="app-nav-link" data-route="dashboard">My Certificates</a>
      <a href="#/safe" class="app-nav-link" data-route="safe">Digital Safe</a>
      <a href="#/settings" class="app-nav-link" data-route="settings">Settings</a>

      <div class="app-balance-label">Balance</div>
