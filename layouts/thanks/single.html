{{ define "main" }}
<style>
.th-wrap{max-width:720px;margin:0 auto;padding:1rem}
.th-card{background:#fdfaf5;border:1px solid #e0d6c8;border-radius:20px;padding:2rem 1.5rem;text-align:center}
.th-mark{font-size:2.4rem;line-height:1;margin:0 0 .6rem;color:#b18b56}
.th-card h1{font-size:1.4rem;color:#2c2416;margin:0 0 1.25rem;line-height:1.3}
.th-body{color:#4a3a2a;font-size:1rem;line-height:1.65;text-align:left}
.th-body p{margin:0 0 1rem}
.th-body strong{color:#b18b56}
.th-body ul,.th-body ol{text-align:left;padding-left:1.2rem}
.th-body li{margin:0 0 .5rem}
.th-actions{margin:1.75rem 0 0;display:flex;gap:.6rem;flex-wrap:wrap;justify-content:center}
.th-actions a{display:inline-block;text-decoration:none;border-radius:999px;padding:.7rem 1.4rem;font-size:.9rem;transition:all .25s ease}
.th-btn-main{background:#2c2416;color:#fdfaf5}
.th-btn-main:hover{background:#4b2e2e}
.th-btn-alt{background:transparent;color:#2c2416;border:1px solid #e0d6c8}
.th-btn-alt:hover{border-color:#b18b56}
.th-note{margin:1.5rem 0 0;font-size:.8rem;color:#6a5a48;line-height:1.5}
@media(max-width:520px){.th-card{padding:1.5rem 1.1rem}.th-actions a{width:100%}}
</style>
<div class="th-wrap">
<article class="th-card fade-in-up">
<div class="th-mark">&#10003;</div>
<h1>{{ .Title }}</h1>
<div class="th-body">
{{ .Content }}
</div>
<div class="th-actions">
<a class="th-btn-main" href="{{ .Params.btn1_url | default "/" }}">{{ .Params.btn1_text | default "Back" }}</a>
<a class="th-btn-alt" href="{{ .Params.btn2_url | default "/" }}">{{ .Params.btn2_text | default "Home" }}</a>
</div>
<p class="th-note">{{ .Params.note_text }}</p>
</article>
</div>
{{ end }}
