{{ define "main" }}
<div class="auth-wrap">
  <div class="auth-card">

    <h1 class="auth-title">Sign in</h1>
    <p class="auth-sub">Enter the email linked to your account. We will send you a secure one-time login link.</p>
    
    <form id="loginForm" autocomplete="on" novalidate>
      <input id="email" type="email" name="email" required placeholder="your@email.com" autocomplete="email">
      <button id="submitBtn" type="submit">Send Magic Link</button>
    </form>
    
    <div id="loginMsg" class="auth-msg" hidden></div>
    
    <p class="auth-foot">The link expires in 1 hour. We never share your email.</p>
  </div>
</div>

<style>
/* Обертка: строгий серый фон, как в приложении */
.auth-wrap {
  min-height: 70vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3rem 1rem;
  background: #f3f4f6; /* Светло-серый фон */
}

/* Карточка: белая, с мягкой тенью, как на дашборде */
.auth-card {
  background: #ffffff;
  border: 1px solid #e5e7eb;
  border-radius: 16px;
  padding: 2.5rem 2rem;
  max-width: 400px;
  width: 100%;
  box-shadow: 0 4px 20px rgba(0,0,0,0.03);
  text-align: center;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

.auth-title {
  color: #111827; /* Почти черный */
  font-size: 1.5rem;
  font-weight: 600;
  margin: 0 0 0.5rem 0;
  letter-spacing: -0.02em;
}

.auth-sub {
  color: #6b7280; /* Серый */
  font-size: 0.95rem;
  margin: 0 0 1.75rem 0;
  line-height: 1.5;
}

#loginForm {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

#email {
  font-family: inherit;
  font-size: 1rem;
  padding: 0.85rem 1rem;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  background: #f9fafb;
  color: #111827;
  outline: none;
  transition: border-color 0.15s;
}

#email:focus {
  border-color: #111827;
  background: #ffffff;
}

#submitBtn {
  font-family: inherit;
  font-size: 1rem;
  font-weight: 600;
  padding: 0.85rem 1rem;
  border: none;
  border-radius: 8px;
  background: #111827; /* Черная кнопка */
  color: #ffffff;
  cursor: pointer;
  transition: background 0.15s;
}

#submitBtn:hover:not(:disabled) {
  background: #374151;
}

#submitBtn:disabled {
  opacity: 0.6;
  cursor: wait;
}

.auth-msg {
  margin-top: 1rem;
  padding: 0.75rem 1rem;
  border-radius: 8px;
  font-size: 0.9rem;
  line-height: 1.4;
  text-align: left;
}

.auth-msg.ok {
  background: #ecfdf5;
  color: #059669;
  border: 1px solid #10b981;
}

.auth-msg.err {
  background: #fef2f2;
  color: #dc2626;
  border: 1px solid #ef4444;
}

.auth-foot {
  font-size: 0.8rem;
  color: #9ca3af;
  margin-top: 2rem;
  margin-bottom: 0;
}

body #openFormBtn { display: none !important; }
</style>

<script>
(function(){
  var form=document.getElementById('loginForm'),
      emailInput=document.getElementById('email'),
      btn=document.getElementById('submitBtn'),
      msg=document.getElementById('loginMsg');
      
  function show(k,t){
    msg.className='auth-msg '+k;
    msg.textContent=t;
    msg.hidden=false;
  }
  
  form.addEventListener('submit',async function(e){
    e.preventDefault();
    btn.disabled=true;
    msg.hidden=true;
    var email=(emailInput.value||'').trim();
    if(!email){
      btn.disabled=false;
      return show('err','Please enter your email.');
    }
    try{
      var redirect=window.location.origin+'/app/';
      var r=await window.imarchAuth.sendLoginLink(email,redirect);
      if(r&&r.error)throw r.error;
      show('ok','Check your email — we sent you a login link.');
      form.reset();
    }catch(err){
      show('err','Could not send the link: '+(err&&err.message?err.message:'unknown error'));
    }finally{
      btn.disabled=false;
    }
  });
})();
</script>
{{ end }}
