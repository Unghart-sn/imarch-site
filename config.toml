# ==========================
# 🧩 CORE CONFIG — IMARCH LTD
# ==========================

disableKinds = ["RSS"]
# theme = ""  ← Удалено, чтобы Hugo не искал "пустую тему"

baseURL = "https://imarch.ltd/"
languageCode = "la"
defaultContentLanguage = "la"
defaultContentLanguageInSubdir = false
title = "Imarchia"

# --------------------------
# 🧠 MARKUP ENGINE SETTINGS
# --------------------------
[markup]
  defaultMarkdownHandler = "goldmark"

  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# --------------------------
# 🪶 SITE PARAMS
# --------------------------
[params]
  logo = "images/logo.png"
  selfHosted = false
  homeTitle = "Imarchia"
  favicon = "images/favicon.ico"
  useHLJS = false
  showAllSections = true 

  [params.author]
    name = "IMARCH LTD UK"
    url = "https://imarch.ltd/en/verdictum/verdictum-0003/"
    

# --------------------------
# 🌍 SITEMAP
# --------------------------
[sitemap]
  changefreq = "monthly"
  priority = 0.5
  filename = "sitemap.xml"

