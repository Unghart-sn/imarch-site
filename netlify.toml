[build]
  publish = "public"

[build.environment]
  HUGO_VERSION = "0.148.2"

[functions]
  directory = "netlify/functions"

[functions."ots-upgrade"]
  schedule = "@hourly"

[functions."daily-audit"]
  schedule = "@daily"

[dev]
  command = "hugo server -w -p 1314 --bind 127.0.0.1"
  targetPort = 1314
  port = 8888